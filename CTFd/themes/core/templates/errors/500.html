{% extends "base.html" %}

{% block content %}
<div class="container py-5">
	<div class="row">
		<div class="col-md-8 offset-md-2">
			<div class="ctf-card text-center py-5 my-4">
				<h1 class="display-3 fw-bold text-danger mb-3">500</h1>
				<h2 class="mb-3">{% trans %}Internal Server Error{% endtrans %}</h2>
				<p class="text-muted mb-4">{{ error }}</p>
				<a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary px-4">
					<i class="fas fa-home me-2"></i>{% trans %}Home{% endtrans %}
				</a>
			</div>
		</div>
	</div>
</div>
{% endblock %}
