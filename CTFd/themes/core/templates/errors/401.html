{% extends "base.html" %}

{% block content %}
<div class="container py-5">
	<div class="row">
		<div class="col-md-8 offset-md-2">
			<div class="ctf-card text-center py-5 my-4">
				<h1 class="display-3 fw-bold text-primary mb-3">401</h1>
				<h2 class="mb-2">{{ error }}</h2>
				<p class="text-muted mb-4">{% trans %}401 Unauthorized{% endtrans %}</p>
				<a href="{{ url_for('auth.login') }}" class="btn btn-primary px-4">
					<i class="fas fa-sign-in-alt me-2"></i>{% trans %}Login{% endtrans %}
				</a>
			</div>
		</div>
	</div>
</div>
{% endblock %}
